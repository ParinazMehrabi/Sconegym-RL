
tonic:
  after_training: ''
  header: "import deprl, gym, sconegym"
  agent: "deprl.custom_agents.dep_factory(3, deprl.custom_mpo_torch.TunedMPO())(replay=deprl.custom_replay_buffers.AdaptiveEnergyBuffer(return_steps=1, batch_size=256, steps_between_batches=1000, batch_iterations=30, steps_before_batches=2e5, num_acts=4))"
  before_training: ''
  checkpoint: "last"
  environment: "deprl.environments.Gym('sconewalk_h0918_ankles_locked-v1', scaled_actions=False)"
  full_save: 1
  name: "sconewalk_h0918_ankles_locked_v4_symmetry_fix2"
  resume: true
  seed: 0
  parallel: 20
  sequential: 10
  test_environment: null
  trainer: "deprl.custom_trainer.Trainer(steps=int(5e8), epoch_steps=int(2e5), save_steps=int(1e6))"

working_dir: "IGNORED_FOR_HYFYDY"

env_args:
  clip_actions: false

  vel_coeff: 4.0
  height_coeff: 3.5             
                                
                                 
  grf_coeff: -0.08
  joint_limit_coeff: -0.3
  limit_proximity_coeff: 0.0 
  smooth_coeff: -0.05
  leg_symmetry_coeff: 1.0   
  nmuscle_coeff: 0.0
  self_contact_coeff: 0.0

  step_size: 0.01
  init_activations_mean: 0.0
  init_activations_std: 0.0

  action_scale: 120.0             
                                 
  action_rate_limit: 0.15
  asymmetry_coeff: 0.0
  impact_coeff: 0.1
  knee_flex_coeff: 0.5
  upright_coeff: 4.0

  leg_switch: true

DEP:
  bias_rate: 0.002
  buffer_size: 200
  intervention_length: 8
  intervention_proba: 0.0005
  kappa: 50
  normalization: "independent"
  q_norm_selector: "l2"
  regularization: 8
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 3
  time_dist: 5
  with_learning: true